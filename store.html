<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>بلاك فاير | المتجر</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/theme.css"/>
</head>
<body class="bg-base text-ink font-body flex flex-col min-h-screen relative overflow-x-hidden">
<div class="ember-field"></div>

<header class="fixed top-0 w-full z-40 pt-safe glass-strong">
  <div class="h-16 px-4 flex items-center justify-between max-w-lg mx-auto">
    <a href="index.html" class="w-10 h-10 rounded-xl bg-surface-high/70 flex items-center justify-center text-muted hover:text-fire transition-colors">
      <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
    </a>
    <div class="flex flex-col items-center leading-tight">
      <span class="font-display text-sm font-bold text-fire-light">متجر بلاك فاير السيادي</span>
      <span class="text-[9px] text-muted tracking-widest">ARMORY</span>
    </div>
    <div class="w-10 h-10"></div>
  </div>
</header>

<main class="flex-1 w-full pt-20 pb-28 max-w-lg mx-auto px-4 space-y-4 relative z-10">

  <!-- Liquidity chest -->
  <div class="card p-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl bg-fire/10 border border-fire/30 flex items-center justify-center">
        <span class="material-symbols-outlined text-fire text-[22px]">savings</span>
      </div>
      <div>
        <p class="text-[11px] text-muted">صندوق سيولة بلاك فاير</p>
        <p class="text-sm font-bold text-ink" id="chest-amount">10,000 EMD</p>
      </div>
    </div>
    <span class="pill px-2.5 py-1 bg-gold/10 text-gold border border-gold/30">شحن فوري</span>
  </div>

  <!-- Search & filter -->
  <div class="flex items-center gap-2">
    <div class="flex-1 flex items-center gap-2 field px-3 py-2.5">
      <span class="material-symbols-outlined text-muted text-[18px]">search</span>
      <input id="search-input" class="bg-transparent outline-none text-sm text-ink w-full placeholder:text-muted" placeholder="ابحث عن سلعة..."/>
    </div>
    <select id="cat-filter" class="field px-3 py-2.5 text-xs text-ink">
      <option value="">كل الأقسام</option>
    </select>
  </div>

  <!-- Items grid -->
  <div id="store-items-container" class="space-y-2.5"></div>

  <div class="card p-3 flex items-center gap-2.5">
    <span class="material-symbols-outlined text-[20px] text-fire">verified</span>
    <span class="text-[11px] text-muted">جميع الطلبات تُعالج مباشرة عبر واتساب المسؤول المعتمد</span>
  </div>
</main>

<!-- Selected item sticky bar -->
<div id="selected-item-info" class="hidden fixed bottom-20 left-0 right-0 z-40 px-4">
  <div class="max-w-lg mx-auto glass-strong rounded-xl p-3 flex items-center justify-between shadow-fire-lg">
    <div>
      <p id="selected-item-name" class="text-xs font-bold text-ink"></p>
      <p id="selected-item-price" class="text-[11px] text-fire font-bold"></p>
    </div>
    <a id="whatsapp-master-link" href="#" target="_blank" class="btn-fire px-4 py-2 rounded-lg text-xs flex items-center gap-1">
      <span class="material-symbols-outlined text-[16px]">chat</span> إتمام الطلب
    </a>
  </div>
</div>

<nav class="fixed bottom-0 w-full z-40 pb-safe glass-strong">
  <div class="flex justify-around items-center h-16 max-w-lg mx-auto px-2">
    <a href="index.html" class="flex flex-col items-center justify-center w-14 h-14 rounded-xl text-muted hover:text-fire-light transition-colors">
      <span class="material-symbols-outlined text-[22px]">home</span>
      <span class="text-[10px] font-medium mt-0.5">الرئيسية</span>
    </a>
    <a href="bank.html" class="flex flex-col items-center justify-center w-14 h-14 rounded-xl text-muted hover:text-fire-light transition-colors">
      <span class="material-symbols-outlined text-[22px]">account_balance</span>
      <span class="text-[10px] font-medium mt-0.5">البنك</span>
    </a>
    <a href="store.html" class="flex flex-col items-center justify-center w-14 h-14 rounded-xl text-fire shadow-fire">
      <span class="material-symbols-outlined text-[22px]">storefront</span>
      <span class="text-[10px] font-bold mt-0.5">المتجر</span>
    </a>
    <a href="admin-store.html" class="flex flex-col items-center justify-center w-14 h-14 rounded-xl text-muted hover:text-fire-light transition-colors">
      <span class="material-symbols-outlined text-[22px]">inventory_2</span>
      <span class="text-[10px] font-medium mt-0.5">إدارة المتجر</span>
    </a>
    <a href="admin-command.html" class="flex flex-col items-center justify-center w-14 h-14 rounded-xl text-muted hover:text-fire-light transition-colors">
      <span class="material-symbols-outlined text-[22px]">shield_person</span>
      <span class="text-[10px] font-medium mt-0.5">القيادة</span>
    </a>
  </div>
</nav>

<script src="assets/app.js"></script>
<script>
  const db = BlackFire.load();
  const catFilter = document.getElementById("cat-filter");
  db.sections.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.name; opt.textContent = s.name;
    catFilter.appendChild(opt);
  });

  const container = document.getElementById("store-items-container");

  function renderItems() {
    const q = document.getElementById("search-input").value.trim().toLowerCase();
    const cat = catFilter.value;
    const items = db.items.filter(i =>
      (!cat || i.section === cat) && (!q || i.name.toLowerCase().includes(q))
    );
    if (items.length === 0) {
      container.innerHTML = `<p class="text-xs text-muted text-center py-8">لا توجد سلع مطابقة</p>`;
      return;
    }
    container.innerHTML = items.map(it => `
      <div class="card p-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-14 h-14 rounded-xl bg-base border border-fire/25 flex items-center justify-center">
            <span class="material-symbols-outlined text-fire text-[24px]">local_fire_department</span>
          </div>
          <div>
            <span class="pill inline-block px-2 py-0.5 bg-fire/10 text-fire mb-1">${it.section}</span>
            <h4 class="text-sm font-bold text-ink">${it.name}</h4>
            <div class="flex items-center gap-2 mt-1">
              <span class="text-xs font-black text-fire">${BlackFire.money(it.priceEmd)} EMD</span>
              <span class="text-[10px] text-muted">أو $${it.priceUsd} USD</span>
            </div>
          </div>
        </div>
        <div class="flex flex-col gap-1.5 items-end">
          <button onclick='selectItem(${JSON.stringify(it).replace(/'/g, "&#39;")})' class="px-4 py-2 rounded-xl btn-fire text-[11px]">طلب فوري</button>
          <button onclick='showDetails(${JSON.stringify(it).replace(/'/g, "&#39;")})' class="text-[10px] text-muted underline">تفاصيل</button>
        </div>
      </div>
    `).join("");
  }
  renderItems();
  document.getElementById("search-input").addEventListener("input", renderItems);
  catFilter.addEventListener("change", renderItems);

  function selectItem(it) {
    document.getElementById("selected-item-info").classList.remove("hidden");
    document.getElementById("selected-item-name").textContent = it.name;
    document.getElementById("selected-item-price").textContent = `${BlackFire.money(it.priceEmd)} EMD / $${it.priceUsd}`;
    const so = db.storeOfficial;
    document.getElementById("whatsapp-master-link").href = BlackFire.waLink(so.phone, `مرحباً، أرغب بطلب: ${it.name} (${it.priceEmd} EMD)`);
    db.orders.unshift({ id: BlackFire.uid("ord"), member: db.members[0].name, item: it.name, qty: 1, status: "قيد المراجعة", date: "الآن" });
    BlackFire.save(db);
  }

  function showDetails(it) {
    BlackFire.openModal(`
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-base text-ink">${it.name}</h3>
        <button onclick="BlackFire.closeModal()" class="text-muted"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="w-full h-32 rounded-xl bg-surface-high flex items-center justify-center mb-3 border border-fire/20">
        <span class="material-symbols-outlined text-fire text-[48px]">local_fire_department</span>
      </div>
      <p class="text-xs text-muted mb-3">${it.desc || "لا يوجد وصف إضافي لهذه السلعة."}</p>
      <div class="flex items-center justify-between text-sm mb-4">
        <span class="text-fire font-black">${BlackFire.money(it.priceEmd)} EMD</span>
        <span class="text-muted">$${it.priceUsd} USD</span>
        <span class="text-[11px] text-muted">المخزون: ${it.stock}</span>
      </div>
      <button onclick='BlackFire.closeModal(); selectItem(${JSON.stringify(it).replace(/'/g, "&#39;")})' class="btn-fire w-full py-3 rounded-xl text-sm">طلب فوري عبر واتساب</button>
    `);
  }
</script>
</body>
</html>
